name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - migration/vercel-independent

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repository has pre-existing formatting/lint debt from the Lovable
      # codebase. Keep reporting it, but do not let thousands of unrelated
      # Prettier errors hide the release-critical gates below.
      - name: Lint baseline report
        continue-on-error: true
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
